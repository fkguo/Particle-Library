name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check generated app version
        run: python3 tool/generate_app_version.py --check
      - name: Analyze (snapshot intentionally absent)
        run: |
          # pubspec declares the runtime snapshot as an asset. The analyzer
          # only needs the path to exist; the test job fetches the real data.
          mkdir -p assets
          : > assets/pdgall-2026.0.sqlite
          flutter analyze

  review-index:
    # The review index is committed (~15 MB) and must stay independent of the
    # 64 MB PDG snapshot variable; these tests never open the main snapshot.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the review index contract and U1-U3
        run: |
          python3 -m pip install -r tool/requirements-review-index.txt
          python3 tool/build_review_index.py verify \
            --db assets/review_index_2026.sqlite \
            --contract lib/core/review_index_contract.dart \
            --rules assets/review_search_rules_v1.json \
            --manifest assets/review_sources_2026.json
      - name: Review search tests (no PDG snapshot required)
        run: |
          # pubspec lists the main snapshot as an asset; these tests do not
          # open it, so a zero-byte placeholder keeps the bundle build happy.
          mkdir -p assets
          : > assets/pdgall-2026.0.sqlite
          flutter test test/search test/data/review_index_live_test.dart

  test:
    runs-on: macos-latest
    # The PDG snapshot is not committed (CC BY data, 64 MB). Configure the
    # repository variable PDG_SNAPSHOT_URL to the official PDG API URL.
    if: ${{ vars.PDG_SNAPSHOT_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fetch and verify the PDG snapshot
        env:
          PDG_SNAPSHOT_URL: ${{ vars.PDG_SNAPSHOT_URL }}
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            "$PDG_SNAPSHOT_URL" -o assets/pdgall-2026.0.sqlite
          echo "c82dab0c0a7c5264f23508066cabb8df9eacc1dbfc83c8d20fade6053394ba8a  assets/pdgall-2026.0.sqlite" \
            | shasum -a 256 -c -
      - run: flutter test
