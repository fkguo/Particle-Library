name: pdgapp
description: "Particle Library: an offline PDG particle-data library."
publish_to: 'none'
version: 0.2.0+15

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  flutter_math_fork: ^0.7.4
  path_provider: ^2.1.5
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  url_launcher: ^6.3.1
  pdfrx: ^2.6.5
  file_selector: ^1.1.0
  flutter_svg: ^2.3.0
  archive: ^4.5.2
  html: ^0.15.7
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pdgall-2026.0.sqlite
    - assets/pdg_notes_2026.sqlite
    - assets/brand/
